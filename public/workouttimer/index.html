<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Viewport config optimized for iOS Safari safe area insets (viewport-fit=cover) and disabled auto-zoom -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Interval Workout Timer</title>
  
  <!-- Apple Mobile Web App capabilities to support full screen when pinned to Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Interval">
  
  <!-- SEO & Accessibility metadata -->
  <meta name="description" content="A premium 40s/20s loop interval workout timer built specifically for iOS Safari with Web Audio support and Screen Wake Lock capabilities.">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Minimalistic Premium Header -->
  <header>
    <h1>INTERVALS</h1>
    <p id="app-subtitle">40s Work • 20s Rest</p>
  </header>

  <!-- Interactive Timer Ring Display -->
  <main class="timer-container" id="timer-card">
    <div class="progress-ring-container">
      <svg class="progress-ring" viewBox="0 0 200 200">
        <!-- Background Track circle -->
        <circle 
          class="progress-ring__circle progress-ring__bg" 
          stroke-width="6" 
          fill="transparent" 
          r="88" 
          cx="100" 
          cy="100" 
        />
        <!-- Dynamic Glowing Foreground progress circle -->
        <circle 
          id="progress-indicator"
          class="progress-ring__circle" 
          stroke="url(#accent-gradient)"
          stroke-width="8" 
          fill="transparent" 
          r="88" 
          cx="100" 
          cy="100" 
          stroke-dasharray="552.92"
          stroke-dashoffset="0"
        />
        <!-- Linear Gradient definitions for premium look -->
        <defs>
          <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop id="gradient-stop-1" offset="0%" stop-color="var(--active-start)" />
            <stop id="gradient-stop-2" offset="100%" stop-color="var(--active-end)" />
          </linearGradient>
        </defs>
      </svg>
      
      <!-- Inner text reading current state -->
      <div class="timer-display">
        <span id="time-display" class="time-left">40</span>
        <span id="timer-state-label" class="timer-label">READY</span>
      </div>
    </div>

    <!-- Active cycle tracking panel -->
    <div class="timer-stats">
      <div class="stat-item">
        <span id="next-phase-val" class="stat-val">—</span>
        <span class="stat-label">Next Up</span>
      </div>
      <div class="stat-item">
        <span id="cycle-count-val" class="stat-val">0</span>
        <span class="stat-label">Round</span>
      </div>
    </div>
  </main>

  <!-- Main Controls Panel -->
  <section class="controls-container">
    <!-- Quick Preset Buttons -->
    <div class="presets-panel">
      <div class="preset-chip active" id="preset-40-20">40s / 20s</div>
      <div class="preset-chip" id="preset-30-15">30s / 15s</div>
      <div class="preset-chip" id="preset-20-10">20s / 10s</div>
    </div>

    <!-- Button triggers -->
    <div class="main-controls">
      <!-- Secondary Reset button -->
      <button id="reset-btn" class="btn btn-secondary" aria-label="Reset Timer">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
        </svg>
        <span>Reset</span>
      </button>

      <!-- Primary Play/Pause button -->
      <button id="primary-btn" class="btn btn-primary" aria-label="Start Timer">
        <!-- Play Icon (shown initially) -->
        <svg id="play-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
        <!-- Pause Icon (hidden initially) -->
        <svg id="pause-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" style="display: none;">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
        <span id="primary-btn-text">Start</span>
      </button>
    </div>

    <!-- iOS Sub-Controls: Mute/Unmute & Wake Lock status -->
    <div class="sub-controls">
      <!-- Mute button -->
      <button id="mute-btn" class="icon-btn active" aria-label="Toggle Sound">
        <!-- Sound On Icon -->
        <svg id="sound-on-icon" viewBox="0 0 24 24">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
        <!-- Sound Off Icon (hidden initially) -->
        <svg id="sound-off-icon" viewBox="0 0 24 24" style="display: none;">
          <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.21.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
        </svg>
      </button>

      <!-- Wake Lock API status indicator -->
      <div id="wakelock-indicator" class="wakelock-badge" title="Keeps iPhone screen active during workout">
        <div class="wakelock-dot"></div>
        <span id="wakelock-text">Keep Screen On</span>
      </div>
    </div>
  </section>

  <!-- Core Javascript Logic -->
  <script src="app.js"></script>
</body>
</html>
